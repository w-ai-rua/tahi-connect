<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Tahi · TikTok</title>
<style>
:root{--bg:#07070b;--card:#15161c;--ink:#f4f2ff;--muted:#9a98a8;--acc:#ff2bd6;--ok:#38e28e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
main{width:100%;max-width:420px;background:var(--card);border-radius:24px;padding:28px 22px;display:flex;flex-direction:column;gap:14px;text-align:center}
h1{margin:0;font-size:24px}p{margin:0;color:var(--muted)}
code{display:block;word-break:break-all;background:#0d0e13;border-radius:14px;padding:14px;font-size:13px;color:var(--ink);text-align:left;user-select:all;-webkit-user-select:all}
button{border:0;border-radius:999px;padding:14px;font:600 16px/1 inherit;background:var(--ink);color:var(--bg)}button.ok{background:var(--ok)}
.err{color:#ff6b6b}
</style></head><body><main id="m"></main>
<script>
// TikTok sends you here after you tap Allow. Nothing is sent anywhere: the code only shows on this screen for you to copy into Tahi.
const q=new URLSearchParams(location.search);const m=document.getElementById('m');const code=q.get('code');
if(code){const v=code+(q.get('state')?'|'+q.get('state'):'');
  m.innerHTML='<h1>TikTok is linked</h1><p>Copy this and paste it into Tahi.</p><code id="c"></code><button id="b">Copy</button><p style="font-size:13px">It works once and expires in a few minutes.</p>';
  document.getElementById('c').textContent=v;
  document.getElementById('b').onclick=async()=>{const b=document.getElementById('b');try{await navigator.clipboard.writeText(v);b.textContent='Copied';b.className='ok'}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById('c'));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Selected, tap Copy'}};}
else if(q.get('error')){m.innerHTML='<h1>Not linked</h1><p class="err"></p><p>Go back to Tahi and try again.</p>';m.querySelector('.err').textContent=q.get('error_description')||q.get('error');}
else{m.innerHTML='<h1>Tahi</h1><p>This page finishes linking TikTok to Tahi. Start from Connections in the app.</p>';}
</script></body></html>
